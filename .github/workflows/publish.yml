# Publishes packages/pet when a v* tag is pushed:
#   - to npmjs via trusted publishing (OIDC, no token; configured on npmjs.com against this file).
#     The publisher is stage-only, so the release waits in npm's stage queue until a maintainer
#     approves it: npm stage approve @markwylde/pet@<version> (or on npmjs.com).
#   - to GitHub Packages (npm.pkg.github.com)
# Bump packages/pet/package.json's version, then: git tag v0.2.0 && git push origin v0.2.0
name: Publish package

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest # staged publishing needs npm >= 11.15
      - run: npm ci
      - run: npm stage publish --access public
        working-directory: packages/pet

  github:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@markwylde'
      - run: npm ci
      - run: npm publish -w @markwylde/pet
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
