# Run from the Actions tab ("Trigger Release" → Run workflow). semantic-release reads the
# conventional commits since the last v* tag, picks the next version, then:
#   - publishes packages/pet to npmjs via trusted publishing (OIDC, no token; configured on
#     npmjs.com against this file, so keep the filename)
#   - publishes it to GitHub Packages (npm.pkg.github.com)
#   - commits the bumped version back to main, tags it and creates a GitHub release
# Nothing is released if there are no feat/fix/breaking commits since the last tag.
name: Trigger Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
